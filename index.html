<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<title>Aetherbound: Spire of Trials</title>
<style>
:root{--bg:#0c111a;--panel:#151e2b;--panel2:#1c2938;--line:#354453;--gold:#d8b779;--gold2:#f1dca8;--text:#eee8dc;--muted:#a9b3bd;--teal:#78c5bd;--violet:#b8a2ef;--red:#e37c78;--green:#8ac68f;--shadow:0 14px 34px #0007}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-serif,Georgia,'Times New Roman',serif}body{background:radial-gradient(ellipse at 52% -14%,#29364a 0,#101722 47%,#0b1017 100%);background-attachment:fixed}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}button:disabled{opacity:.38;cursor:not-allowed}.hidden{display:none!important}
#app{max-width:1440px;margin:auto;min-height:100vh;padding:16px 18px 24px}.topbar{display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff17;padding:4px 3px 13px;margin-bottom:16px}.mark{width:42px;height:42px;flex:none}.brand{min-width:0}.brand h1{font-size:19px;letter-spacing:.11em;margin:0;text-transform:uppercase;font-weight:600}.brand small{color:var(--muted);font:10px/1.4 ui-sans-serif,system-ui;letter-spacing:.17em;text-transform:uppercase}.top-spacer{flex:1}.tiny-btn{background:#162130;border:1px solid #3b4a5b;border-radius:9px;padding:8px 11px;font:11px ui-sans-serif,system-ui;letter-spacing:.06em}.tiny-btn:hover{border-color:var(--gold);background:#202b3a}.eyebrow{font:10px ui-sans-serif,system-ui;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}.muted{color:var(--muted)}.screen{animation:appear .24s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(150deg,#1a2533f2,#111924f7);border:1px solid #425163;border-radius:13px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid #ffffff12}.panel-head h2,.panel-head h3{font-size:12px;text-transform:uppercase;letter-spacing:.13em;margin:0;font-weight:600}.panel-body{padding:15px}.gold{color:var(--gold2)}.teal{color:var(--teal)}.violet{color:var(--violet)}.red{color:var(--red)}
/* Title */
.title-wrap{min-height:calc(100vh - 100px);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:26px;align-items:center;padding:18px 5% 40px}.title-art{position:relative;min-height:480px;display:grid;place-items:center;overflow:hidden}.title-art:before{content:"";position:absolute;width:360px;height:360px;border:1px solid #d8b77933;border-radius:50%;box-shadow:0 0 0 38px #d8b77908,0 0 0 76px #d8b77905}.spire-svg{width:min(100%,500px);max-height:570px;position:relative;filter:drop-shadow(0 24px 24px #0008);animation:floaty 6s ease-in-out infinite}@keyframes floaty{50%{transform:translateY(-8px)}}.title-copy h2{font-size:clamp(38px,6vw,72px);line-height:.95;letter-spacing:-.035em;font-weight:500;margin:13px 0 16px}.title-copy h2 em{color:var(--gold2);font-style:normal}.title-copy p{font:14px/1.7 ui-sans-serif,system-ui;color:#c0c8d0;max-width:490px}.cta{margin-top:22px;border:1px solid #ead3a1;border-radius:9px;padding:14px 20px;background:linear-gradient(135deg,#d9bd82,#927349);color:#17202b;font:700 12px ui-sans-serif,system-ui;letter-spacing:.13em;text-transform:uppercase;box-shadow:0 5px 20px #d8b77925;min-width:190px}.cta:hover{filter:brightness(1.09);transform:translateY(-1px)}.feature-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.feature{border:1px solid #ffffff19;background:#ffffff06;padding:8px 10px;border-radius:6px;color:#bac4ce;font:10px ui-sans-serif,system-ui;letter-spacing:.08em;text-transform:uppercase}.disclaimer{margin-top:16px;font:10px/1.5 ui-sans-serif,system-ui;color:#748394;max-width:440px}
/* Map */
.map-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr);gap:16px}.map-intro{padding:18px 20px}.map-intro h2{font-size:29px;font-weight:500;margin:6px 0}.map-intro p{margin:6px 0 0;color:#aab6c2;font:12px/1.6 ui-sans-serif,system-ui;max-width:640px}.map-rows{padding:18px 24px;display:flex;flex-direction:column;gap:10px;position:relative}.map-row{display:grid;grid-template-columns:66px minmax(0,1fr);align-items:center;gap:12px;position:relative}.map-row:not(:last-child):after{content:"";position:absolute;left:93px;top:44px;width:1px;height:17px;background:#7e8c9b45}.row-label{font:9px ui-sans-serif,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#82909f}.node-group{display:flex;gap:12px;justify-content:center}.map-node{width:86px;height:68px;border:1px solid #47566a;background:linear-gradient(140deg,#253244,#151e2b);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.15s;position:relative}.map-node .symbol{font-size:21px;line-height:1;color:var(--gold2)}.map-node .node-name{font:9px ui-sans-serif,system-ui;letter-spacing:.04em;color:#c6d0da}.map-node.available{border-color:#b79d6c;box-shadow:0 0 0 1px #d8b77918,0 0 20px #c3a16914}.map-node.available:hover{transform:translateY(-2px);background:#2c3a4d;border-color:#f0d6a0}.map-node.done{background:#1d433e;border-color:#5d9e91}.map-node.selected{box-shadow:0 0 0 2px var(--gold2)}.map-node.locked{opacity:.3;filter:saturate(.35)}.spire-climb{position:relative;min-height:255px;overflow:hidden;border:1px solid #586985;border-radius:12px;background:#101b30;box-shadow:var(--shadow)}.spire-climb:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a1322f5 0%,#0a1322d9 43%,#0a132222 100%),url("data:image/webp;base64,UklGRohTAABXRUJQVlA4IHxTAADw7QCdASqvAIQBPj0aikOiIaEVKh54IAPEoAtdZYVh9fe+L6X+N9F7lXuY+tZTuq7sny9OlvOv/0/V//X/997B/9Q9KvpT8yX7eeqd/y/3A93X9Z/3vsD/0T/I///2cf/B///dd/t3/a///uOftr///aV/+Hs/f3/ function titleScreen(){return `<section class="title-wrap"><div class="title-art">${svgTower()}</div><div class="title-copy"><div class="eyebrow">A tactical climb into the unknown</div><h2>AETHER<br><em>BOUND</em></h2><p>The Spire feeds on certainty. Build a deck, read the enemy’s intent, and outmaneuver the living wards that guard its floors. Every choice shapes your climb.</p><p>Fight with precision. Break magical tethers before they drain your momentum. Discover relics and find a route through the shifting tower.</p><button class="cta" data-action="start">Begin the ascent&nbsp; ↗</button><div class="feature-row"><span class="feature">Turn-based card combat</span><span class="feature">Branching route</span><span class="feature">Relics & upgrades</span></div><div class="disclaimer">A complete, original browser game. No downloads, accounts, or external assets required. Best played in landscape on phones, but works in portrait too.</div></div></section>`;}
function relicsHTML(){if(!state.relics.length)return `<div class="relics"><div class="relic empty">·</div><div class="relic empty">·</div><div class="relic empty">·</div></div>`;return `<div class="relics">${state.relics.map(k=>`<div class="relic" title="${relicDefs[k]?.name||k}">${relicDefs[k]?.icon||'✧'}</div>`).join('')}</div>`;}
function statTile(value,label){return `<div class="status-tile"><strong>${value}</strong><span>${label}</span></div>`;}
function mapScreen(){
 const rows=state.map.map((row,ri)=>`<div class="map-row"><div class="row-label">${ri===6?'Crown':`Tier ${String(ri+1).padStart(2,'0')}`}</div><div class="node-group">${row.map((n,ci)=>{let available=ri===state.stage&&!state.selected[ri],done=n.done,locked=ri>state.stage;let cls=['map-node',available?'available':'',done?'done':'',locked?'locked':'',state.selected[ri]===ci?'selected':''].join(' ');let meta=nodeMeta[n.type];return `<button class="${cls}" data-action="node" data-row="${ri}" data-col="${ci}" ${available?'':'disabled'} aria-label="${meta.name}, tier ${ri+1}"><span class="symbol">${done?'✓':meta.icon}</span><span class="node-name">${meta.name}</span></button>`}).join('')}</div></div>`).join('');
 return `<section class="map-layout"><div><div class="panel map-intro"><div class="eyebrow">The ascent · ${Math.min(state.stage+1,7)} of 7</div><h2>Choose your next step.</h2><p>Each tier offers three routes. Battles earn cards; sanctuaries mend wounds; caches and mysteries can change your run. The Warden waits at the summit.</p></div><div class="panel map-rows" style="margin-top:12px">${rows}</div></div><aside class="map-side"><section class="spire-climb" aria-label="Spire ascent progress"><div class="spire-climb-content"><div><div class="eyebrow">The Spire · Ascension route</div><h3>Whispering Spire</h3><div class="floor-count">Floor ${Math.min(state.stage+1,7)} / 7 · ${state.stage>=6?'Summit approach':'Climbing'}</div><div class="spire-progress">${Array.from({length:7},(_,i)=>`<i class="${i<state.stage?'done':i===state.stage?'current done':''}"></i>`).join('')}</div></div><div><div class="small-note">A hundred unseen floors rise above the clouds. This trial traces the first seven gates toward the summit.</div><div class="spire-floor-list">${['Gate I','Gate II','Gate III','Gate IV','Gate V','Gate VI','Crown'].map((f,i)=>`<span class="${i===state.stage?'current':i<state.stage?'done':''}">${f}</span>`).join('')}</div></div></div></section><button class="panel character-map-card" data-action="character" style="display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer"><span style="display:block;width:76px;height:98px;flex:0 0 76px;overflow:hidden;background:radial-gradient(ellipse at 50% 80%,#45637a55,transparent),#0d1520;border-radius:8px;border:1px solid #46586a;padding-top:3px">${heroSVG()}</span><span style="display:block;flex:1"><span class="eyebrow">YOUR ASCENDER</span><strong style="display:block;color:#f0d6a0;font-size:18px;margin:5px 0">Lyria</strong><span class="small-note">Silver-haired Aether Mage<br>Tap to view character model ↗</span></span></button><div class="panel"><div class="panel-head"><h3>Ascender status</h3><span class="eyebrow">LIVE</span></div><div class="panel-body"><div class="status-grid">${statTile(`${state.hero.hp}/${state.hero.maxHp}`,'Vitality')}${statTile(state.gold,'Aether coins')}${statTile(state.deck.length,'Deck size')}${statTile(state.potions,'Potions')}</div><div style="margin-top:15px"><div class="eyebrow" style="margin-bottom:9px">Relics</div>${relicsHTML()}</div></div></div><div class="panel"><div class="panel-head"><h3>Climber's notes</h3></div><div class="panel-body small-note">${state.stage===0?'Your opening deck favors steady strikes and guard. Save your escape cards for when the enemy begins stacking tethers.':state.stage<6?'Check each enemy’s intent before spending your energy. A blocked attack costs the enemy a turn but leaves you in control.':'The summit is close. Upgrade your strongest card, manage your guard, and keep an escape option in hand.'}<p style="margin-bottom:0">Tip: click a node in the highlighted tier to proceed. There are no wrong paths, only different costs.</p></div></div></aside></section>`;
}

function characterSheet(pose='idle',cape=true){const h=state?.hero||{hp:50,maxHp:50,bind:0};const actionTiles=actionNames.map((n,i)=>`<button class="gallery-tile" data-action="pose" data-pose="${({Idle:'idle',Walk:'idle',Run:'escape',Attack:'attack','Cast Spell':'cast',Guard:'guard',Escape:'escape'})[n]}" title="Preview ${n}"><img src="${actionArt[i]}" alt="Lyria ${n} pose"><span>${n}</span></button>`).join('');const level=Math.min(7,Math.max(0,h.bind||0));const restraintTiles=restraintNames.map((n,i)=>`<div class="gallery-tile"><img src="${restraintArt[i]}" alt="${n} visual state"><span>${n}</span></div>`).join('');$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal character-modal"><div class="eyebrow">Character atelier · anime action gallery</div><h2>Lyria, the Aether Mage</h2><p>Adult spellcaster · Wayfarer class · Silver hair, layered travel robes, rune staff.</p><div class="character-preview pose-${pose} ${cape?'cape-on':'cape-off'}">${heroSVG()}<div class="character-glow"></div></div><div class="character-stats"><span>Vitality <b>${h.hp}/${h.maxHp}</b></span><span>Restraint <b>${h.bind||0}/4</b></span><span>Level <b>${state?.stage+1||1}</b></span></div><div class="character-controls"><button class="secondary-btn" data-action="pose" data-pose="idle">Idle</button><button class="secondary-btn" data-action="pose" data-pose="cast">Cast spell</button><button class="secondary-btn" data-action="pose" data-pose="attack">Attack</button><button class="secondary-btn" data-action="pose" data-pose="guard">Guard</button><button class="secondary-btn" data-action="pose" data-pose="escape">Escape</button><button class="secondary-btn" data-action="cape" data-cape="${cape?'off':'on'}">${cape?'Hide cape':'Show cape'}</button></div><div class="illustration-gallery"><h3>Actions & poses · choose to preview</h3><div class="gallery-grid">${actionTiles}</div></div><div class="illustration-gallery"><h3>Restraint progression · illustrated states</h3><div class="restraint-current"><img src="${restraintArt[level]}" alt="Current restraint state: ${restraintNames[level]}"><div><b>Current state: ${restraintNames[level]}</b><small>Pressure ${h.bind||0}/4 · Escape cards, potions, and Struggle Free can lower pressure.</small></div></div><div class="gallery-grid" style="margin-top:8px">${restraintTiles}</div></div><div class="modal-actions"><button class="cta" data-action="closemodal">Return to game</button></div></div></div>`;}

function enemySVG(kind){
 const c=kind==='binder'?'#7c67a7':kind==='knight'?'#a0a8b2':kind==='boss'?'#a16b83':'#7f908d'; const accent=kind==='boss'?'#e4bd7e':kind==='binder'?'#c6a5ff':'#d5bd86';
 return `<svg viewBox="0 0 180 240" role="img" aria-label="Fantasy tower enemy"><defs><linearGradient id="enemyMetal" x1="0" x2="1"><stop stop-color="${c}"/><stop offset=".5" stop-color="#283242"/><stop offset="1" stop-color="#101722"/></linearGradient></defs><ellipse cx="90" cy="225" rx="50" ry="8" fill="#030508" opacity=".9"/><path d="M55 99 37 131 31 208 66 217 87 148 109 217 147 208 141 130 122 98Z" fill="url(#enemyMetal)" stroke="${accent}" stroke-opacity=".7" stroke-width="2"/><path d="M65 106 90 149 115 106 109 207 72 207Z" fill="#101722" stroke="${accent}" stroke-opacity=".45" stroke-width="2"/><path d="M55 111 35 158 54 171 76 125M125 111 145 158 126 171 104 125" fill="${c}" stroke="${accent}" stroke-opacity=".65" stroke-width="2"/><path d="M59 70Q61 35 90 32Q121 34 122 70L115 102 65 102Z" fill="url(#enemyMetal)" stroke="${accent}" stroke-width="2"/><path d="M58 56 47 22 79 41M122 56 134 22 101 41" fill="${c}" stroke="${accent}" stroke-width="2"/><path d="M68 70 83 65 82 77 68 80M112 70 97 65 98 77 112 80" fill="${accent}"/><path d="M82 93 90 87 98 93" fill="none" stroke="#e3a08d" stroke-width="3"/><path d="M90 13V-1M34 37 19 29M145 38 161 28" stroke="${accent}" stroke-width="3" stroke-linecap="round"/><path d="M43 135 22 184M137 135 158 184" stroke="#151d2b" stroke-width="13" stroke-linecap="round"/><circle cx="90" cy="115" r="7" fill="${accent}" opacity=".9"/><path d="M90 122V144M79 132H101" stroke="${accent}" stroke-width="2" opacity=".85"/></svg>`;
}
function getEnemy(kind,elite,boss){let base;if(boss)base={name:'The Tether Warden',kind:'boss',hp:88,attack:11,elite:false};else if(kind==='binder')base={name:elite?'Violet Archbinder':'Violet Binder',kind:'binder',hp:elite?58:38,attack:elite?9:7,elite};else if(kind==='knight')base={name:elite?'Mirror Captain':'Mirror Knight',kind:'knight',hp:elite?61:42,attack:elite?10:8,elite};else base={name:elite?'Ironbound Sentinel':'Hollow Guard',kind:'guard',hp:elite?60:36,attack:elite?10:7,elite};
 const scale=Math.max(0,state.stage-1);base.hp+=scale*5+(state.stage===0?0:0);base.maxHp=base.hp;base.block=0;base.intent='strike';base.intentValue=base.attack;base.intentText='Attack';base.weak=false;base.firstAttack=true;return base;}
function startBattle(elite=false,boss=false){
 state.phase='combat';state.hero.pose='idle';state.node=state.node||{type:boss?'boss':elite?'elite':'battle'};state.combatNo++;state.hero.block=0;state.hero.bind=0;state.hero.weak=0;state.hero.struggleUsed=false;state.hero.gear={wrists:0,legs:0,torso:0};state.energy=3+(state.relics.includes('lens')?1:0);state.turn=1;state.draw=state.deck.slice().sort(()=>Math.random()-.5);state.discard=[];state.hand=[];state.log=[];state.extraReward=elite;
 let kind=boss?'boss':pick(['guard','binder','knight']);state.enemy=getEnemy(kind,elite,boss);if(boss){state.enemy.hp+=Math.max(0,state.stage-2)*4;state.enemy.maxHp=state.enemy.hp;}if(state.relics.includes('thread'))state.hero.bind=0;
 drawCards(5+(state.relics.includes('star')?1:0));rollIntent();addLog(`${state.enemy.name} blocks the way.`);render();}
function drawCards(n){for(let i=0;i<n;i++){if(state.hand.length>=10)break;if(!state.draw.length){if(!state.discard.length)break;state.draw=state.discard.splice(0).sort(()=>Math.random()-.5);addLog('Discard pile shuffled into the deck.');}state.hand.push(state.draw.pop());}}
function rollIntent(){let e=state.enemy;if(!e)return;let options=e.kind==='boss'?['strike','strike','snare','heavy','brace']:e.kind==='binder'?['snare','strike','snare','heavy','brace']:['strike','strike','snare','heavy','brace'];e.intent=pick(options);const scale=e.elite?2:0;const per=state.stage>0?Math.floor(state.stage/2):0;
 if(e.intent==='strike'){e.intentText='Attack';e.intentValue=e.attack+per;}
 if(e.intent==='heavy'){e.intentText='Heavy attack';e.intentValue=e.attack+5+per;}
 if(e.intent==='snare'){e.intentText='Bind attempt';e.intentValue=1+(e.kind==='boss'?1:0);}
 if(e.intent==='brace'){e.intentText='Brace';e.intentValue=6+(e.elite?3:0);}
}
function healthbar(cur,max,klass=''){return `<div class="bar ${klass}"><i style="width:${clamp(cur/max*100,0,100)}%"></i></div>`;}
function combatScreen(){let e=state.enemy,h=state.hero;let hpPct=clamp(h.hp/h.maxHp*100,0,100);let currentNode=state.node?.type==='boss'?'SUMMIT TRIAL':state.node?.type==='elite'?'ELITE ENCOUNTER':'TOWER ENCOUNTER';
 let hand=state.hand.map((key,i)=>{let c=cardDefs[key],up=state.upgrades.includes(key);let cost=Math.max(0,c.cost-(up&&c.cost>0?1:0));let desc=up?upgradeDesc(key):c.desc;return `<button class="card ${c.type}" data-action="play" data-index="${i}" ${state.energy<cost?'disabled':''}><div class="card-top"><span class="card-cost">${cost}</span><span class="card-type">${c.type}</span></div><div class="card-art"><img src="${actionArt[({jab:3,spark:4,nova:4,flare:4,echo:4,veil:5,counter:5,ward:5,slip:6,needle:3,unravel:6,step:1}[key]??0)]}" alt="${actionNames[({jab:3,spark:4,nova:4,flare:4,echo:4,veil:5,counter:5,ward:5,slip:6,needle:3,unravel:6,step:1}[key]??0)]} action illustration" loading="lazy"></div><div class="card-name">${c.name}${up?' +':''}</div><div class="card-desc">${desc}</div><div class="card-tag">${c.tag}</div></button>`}).join('');
 return `<div class="combat-head"><div class="panel combat-title"><div class="eyebrow">${currentNode} · TURN ${state.turn}</div><h2>${e.name}</h2><div class="chip">Floor ${state.stage+1} <span class="muted">/</span> 7</div> <div class="chip">${e.elite?'Veteran':'Threat'} <span class="red">${e.elite?'◆◆':'◆'}</span></div></div><div class="panel combat-title" style="flex:0 0 auto;min-width:190px"><div class="eyebrow">Enemy vitality</div><div style="display:flex;align-items:center;gap:9px;margin-top:8px">${healthbar(e.hp,e.maxHp,'enemybar')}<span class="hp-num">${e.hp}/${e.maxHp}</span></div><div class="small-note" style="margin-top:7px">${e.block?`Guard: ${e.block} · `:''}${e.weak?'Weakened':''}</div></div></div>
 <div class="combat-layout"><section><div class="arena"><div class="runes"></div><div class="arena-top"><div><span class="chip">✦ ${state.gold} coins</span> <button class="chip potion-chip" data-action="potion" title="Restore up to 15 vitality and loosen one tether">♧ ${state.potions} potion · use</button></div><div class="intent"><strong>${e.intentText}: ${e.intent==='snare'?'+'+e.intentValue+' restraint':e.intentValue+(e.intent==='brace'?' guard':' dmg')}</strong><small>Enemy's next move</small></div></div><div class="actors"><div class="actor" id="hero-actor"><div class="actor-shadow"></div>${heroSVG()}<div class="actor-name">Aether Mage</div></div><div class="actor enemy" id="enemy-actor"><div class="actor-shadow"></div>${enemySVG(e.kind)}<div class="actor-name">${e.name}</div></div></div></div>
 <div class="battle-bottom"><div class="panel hero-panel"><div class="hero-core"><div class="hero-name">Vitality</div><div class="hp-line"><span>HP</span>${healthbar(h.hp,h.maxHp)}<span class="hp-num">${h.hp}/${h.maxHp}</span></div><div class="hp-line" style="margin-top:7px"><span>Bind</span>${healthbar(h.bind,4,'bindbar')}<span class="hp-num">${h.bind}/4</span></div></div><div class="metrics"><div class="metric">Guard <b>${h.block}</b></div><div class="metric">Tether <b>${h.bind}/4</b></div>${h.weak?`<div class="metric">Weak <b>${h.weak}</b></div>`:''}</div></div><div class="restraint-panel"><div class="restraint-title"><span>RESTRAINT STATUS</span><b>${h.bind}/4</b></div><div class="pressure-track">${[0,1,2,3].map(i=>`<i class="${h.bind>i?'filled':''}"></i>`).join('')}</div><div class="gear-slots"><span class="${h.gear?.wrists?'equipped':''}">◉ WRISTS ${h.gear?.wrists?'LOCKED':'FREE'}</span><span class="${h.gear?.legs?'equipped':''}">⌁ LEGS ${h.gear?.legs?'BOUND':'FREE'}</span><span class="${h.gear?.torso?'equipped':''}">◇ TORSO ${h.gear?.torso?'WRAPPED':'FREE'}</span></div><button class="struggle-btn" data-action="struggle" ${h.struggleUsed||h.bind===0?'disabled':''}>⤨ STRUGGLE FREE <small>${h.struggleUsed?'USED THIS TURN':h.bind===0?'NO RESTRAINTS':'FREE ACTION · REDUCE PRESSURE BY 1'}</small></button></div><div class="panel combat-tools"><div class="tools-title">Run inventory</div><div class="deck-stats"><div class="deck-stat"><b>${state.draw.length}</b><span>Draw pile</span></div><div class="deck-stat"><b>${state.discard.length}</b><span>Discard</span></div></div><div><div class="tools-title" style="margin-top:2px">Relics</div>${relicsHTML()}</div><div class="log-box">${state.log.map(s=>`<div class="log-line">${s}</div>`).join('')}</div></div></div>
 <div class="hand-section"><div class="hand-head"><h3>Your hand <span class="muted">· ${state.hand.length} cards</span></h3><div class="battle-actions"><div class="energy-pill">✧ Energy <b>${state.energy}</b></div><button class="endturn" data-action="endturn">End turn ↗</button></div></div><div class="hand">${hand}</div><div class="action-note">Tap a card to play it. Guard absorbs incoming damage; tether pressure of 3 or more reduces next turn's energy. Escape cards lower tether pressure.</div></div>
 </section></div>`;
}
function upgradeDesc(k){const map={jab:'Deal 10 damage.',veil:'Gain 11 guard.',spark:'Deal 12 damage.',slip:'Reduce bind by 3. Gain 6 guard.',step:'Gain 5 guard. Draw 1 card.',counter:'Deal 6 damage. Gain 7 guard.',nova:'Deal 21 damage.',echo:'Gain 1 energy. Draw 2 cards.',needle:'Deal 9 damage. Reduce bind by 2.',flare:'Deal 16 damage. Gain 6 guard.',ward:'Gain 8 guard. Weaken the next hit by 4.',unravel:'Reduce bind by 4. Draw 2 cards.'};return map[k]||cardDefs[k].desc;}
function upgradedCost(k){return state.upgrades.includes(k)&&cardDefs[k].cost>0?cardDefs[k].cost-1:cardDefs[k].cost;}
function hitFloat(target,text){const el=document.getElementById(target);if(!el)return;el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');const f=document.createElement('div');f.className='floating-text';f.textContent=text;el.appendChild(f);setTimeout(()=>f.remove(),850);}
function dealDamage(amount){let e=state.enemy;let hit=amount;if(e.weak){hit=Math.max(0,hit-2);e.weak=false;}const absorbed=Math.min(e.block,hit);e.block-=absorbed;hit-=absorbed;e.hp-=hit;if(hit>0)hitFloat('enemy-actor','−'+hit);if(absorbed>0)addLog(`Enemy guard absorbs ${absorbed}.`);if(e.hp<=0)e.hp=0;return hit;}
function gainBlock(n){state.hero.block+=n;addLog(`You gain ${n} guard.`);}
function reduceBind(n){let before=state.hero.bind;state.hero.bind=Math.max(0,state.hero.bind-n);let actual=before-state.hero.bind;addLog(actual?`You loosen ${actual} tether${actual===1?'':'s'}.`:'No tether to loosen.');}
function playCard(index){if(state.phase!=='combat')return;const k=state.hand[index];if(!k)return;const c=cardDefs[k],cost=upgradedCost(k);if(state.energy<cost)return;state.energy-=cost;state.hand.splice(index,1);state.discard.push(k);const up=state.upgrades.includes(k);let d=up;state.hero.pose=({jab:'attack',spark:'cast',nova:'cast',flare:'cast',echo:'cast',veil:'guard',counter:'guard',ward:'guard',slip:'escape',needle:'attack',unravel:'escape',step:'guard'})[k]||'idle';
 const dmg=(base)=>dealDamage(base+(d?({jab:3,veil:0,spark:3,slip:0,step:0,counter:2,nova:5,echo:0,needle:3,flare:4,ward:0,unravel:0}[k]||0):0));
 switch(k){case'jab':dmg(7);break;case'veil':gainBlock(up?11:8);break;case'spark':dmg(9);break;case'slip':reduceBind(up?3:2);gainBlock(up?6:4);break;case'step':gainBlock(up?5:3);drawCards(1);break;case'counter':dmg(4);gainBlock(up?7:5);break;case'nova':dmg(up?21:16);break;case'echo':state.energy+=1;drawCards(up?2:1);addLog('Mana surges through your deck.');break;case'needle':dmg(up?9:6);reduceBind(up?2:1);break;case'flare':dmg(up?16:12);gainBlock(up?6:4);break;case'ward':gainBlock(up?8:5);state.hero.weak=up?4:3;addLog('A mirror ward softens the next blow.');break;case'unravel':reduceBind(up?4:3);drawCards(up?2:1);break;}
 if(state.enemy.hp<=0){winBattle();return;}render();}
function enemyAct(){let e=state.enemy,h=state.hero;switch(e.intent){case'strike':case'heavy':{let raw=e.intentValue;if(h.weak){raw=Math.max(0,raw-h.weak);h.weak=0;}if(e.firstAttack&&state.relics.includes('feather')){raw=Math.max(0,raw-3);e.firstAttack=false;addLog('Glass Feather deflects part of the blow.');}const blocked=Math.min(h.block,raw);h.block-=blocked;const hpDmg=raw-blocked;h.hp-=hpDmg;if(hpDmg>0)hitFloat('hero-actor','−'+hpDmg);addLog(`${e.name} strikes for ${raw}${blocked?`, ${blocked} blocked`:''}.`);break;}case'snare':{let amount=e.intentValue||1;h.bind=clamp(h.bind+amount,0,4);if(h.gear){if(h.bind>=2)h.gear.wrists=1;if(h.bind>=3)h.gear.legs=1;if(h.bind>=4)h.gear.torso=1;}addLog(`Binding pressure rises by ${amount}; restraint level ${h.bind}/4.`);if(h.bind>=3)addLog('Tether pressure is high: next turn starts with less energy.');break;}case'brace':e.block+=e.intentValue;addLog(`${e.name} gains ${e.intentValue} guard.`);break;}}
function endTurn(){if(state.phase!=='combat')return;if(state.enemy.hp<=0){winBattle();return;}state.discard.push(...state.hand);state.hand=[];enemyAct();state.hero.block=0;if(state.hero.hp<=0){state.hero.hp=0;state.phase='gameover';render();return;}if(state.relics.includes('thread'))reduceBind(1);state.turn++;state.hero.struggleUsed=false;state.hero.pose='idle';state.energy=Math.max(1,3+(state.relics.includes('lens')?1:0)-(state.hero.bind>=3?1:0));if(state.hero.bind>=3)addLog('Tether pressure drains 1 energy.');drawCards(5);rollIntent();render();}
function winBattle(){if(state.phase!=='combat')return;const boss=state.node?.type==='boss';state.hero.bind=0;state.hero.block=0;state.discard.push(...state.hand);state.hand=[];state.draw=[];if(boss){state.phase='victory';render();return;}state.phase='reward';state.rewardPool=[pick(allCardKeys),pick(allCardKeys),pick(allCardKeys)];while(new Set(state.rewardPool).size<3)state.rewardPool=[...new Set([...state.rewardPool,pick(allCardKeys)])].slice(0,3);if(state.extraReward)grantRelic();addLog('Victory. Choose a card to add to your deck.');render();}
function cardHTML(k,i,action='choosecard'){const c=cardDefs[k],up=state.upgrades.includes(k);return `<button class="card ${c.type}" data-action="${action}" data-index="${i}"><div class="card-top"><span class="card-cost">${upgradedCost(k)}</span><span class="card-type">${c.type}</span></div><div class="card-art"><img src="${actionArt[({jab:3,spark:4,nova:4,flare:4,echo:4,veil:5,counter:5,ward:5,slip:6,needle:3,unravel:6,step:1}[k]??0)]}" alt="Action illustration" loading="lazy"></div><div class="card-name">${c.name}${up?' +':''}</div><div class="card-desc">${up?upgradeDesc(k):c.desc}</div><div class="card-tag">${c.tag}</div></button>`;}
function rewardScreen(){return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Encounter cleared · ${state.roomsCleared} victory</div><h2>Choose your reward.</h2><p>A new technique joins your deck. Pick one card, or skip to continue climbing.<br><span class="gold">+15 aether coins</span> have been collected.</p></div><div class="reward-cards">${state.rewardPool.map((k,i)=>cardHTML(k,i)).join('')}</div><div style="text-align:center;padding:6px 15px 22px"><button class="secondary-btn" data-action="skipreward">Leave reward behind →</button></div></section>`;}
function chooseNode(row,col){if(!state||state.phase!=='map'||row!==state.stage)return;const n=state.map[row][col];if(!n||n.done)return;state.selected[row]=col;n.done=true;state.node=n;state.gold+=5;
 switch(n.type){case'battle':startBattle(false,false);break;case'elite':startBattle(true,false);break;case'boss':startBattle(false,true);break;case'rest':state.phase='rest';render();break;case'treasure':openTreasure();break;case'event':state.phase='event';render();break;}}
function openTreasure(){const newR=pick(Object.keys(relicDefs).filter(k=>!state.relics.includes(k)));if(newR)grantRelic(newR);state.gold+=20;state.phase='treasure';render();}
function grantRelic(key){key=key||pick(Object.keys(relicDefs).filter(k=>!state.relics.includes(k)));if(!key){state.gold+=15;return;}if(state.relics.includes(key)){state.gold+=15;return;}state.relics.push(key);if(key==='heart'){state.hero.maxHp+=8;state.hero.hp=Math.min(state.hero.maxHp,state.hero.hp+8);}if(key==='coin')state.gold+=25;addLog(`Relic acquired: ${relicDefs[key].name}.`);}
function completeNode(){state.roomsCleared++;state.stage++;state.node=null;if(state.stage>=7){state.phase='victory';}else{state.phase='map';addLog('The route ahead shifts into view.');}render();}
function chooseReward(i){let k=state.rewardPool[i];if(k){state.deck.push(k);state.gold+=15;addLog(`${cardDefs[k].name} added to your deck.`);}completeNode();}
function roomScreen(kind){if(kind==='rest')return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Sanctuary</div><h2>Take a moment to recover.</h2><p>A ring of warm runes hums quietly. Choose how to prepare for the next floor.</p></div><div class="choice-grid"><button class="choice-card" data-action="restheal"><div class="choice-icon">♨</div><h3>Rest by the brazier</h3><p>Recover 20 vitality, up to your maximum.</p></button><button class="choice-card" data-action="restupgrade"><div class="choice-icon">✧</div><h3>Inscribe a card</h3><p>Upgrade every copy of one card type, lowering its cost or improving its effect.</p></button><button class="choice-card" data-action="restskip"><div class="choice-icon">↗</div><h3>Move on</h3><p>Keep your resources and continue the ascent.</p></button></div></section>`;
 if(kind==='treasure')return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Hidden cache opened</div><h2>A relic for the road.</h2><p>You gained 20 coins and found a relic: <span class="gold">${relicDefs[state.relics[state.relics.length-1]]?.name||'Aether Shard'}</span>.</p></div><div class="choice-grid"><div class="choice-card"><div class="choice-icon">${relicDefs[state.relics[state.relics.length-1]]?.icon||'✧'}</div><h3>${relicDefs[state.relics[state.relics.length-1]]?.name||'Aether Shard'}</h3><p>${relicDefs[state.relics[state.relics.length-1]]?.desc||'A small piece of condensed aether.'}</p></div><button class="choice-card" data-action="cachepotion"><div class="choice-icon">♧</div><h3>Fill a potion vial</h3><p>Take one additional potion for a future emergency.</p></button><button class="choice-card" data-action="continue"><div class="choice-icon">↗</div><h3>Continue climbing</h3><p>Leave the chamber and return to the route map.</p></button></div></section>`;
 if(kind==='event')return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Strange encounter</div><h2>The Cartographer in Ash.</h2><p>A hooded figure sketches paths that do not exist on the wall. “Every shortcut takes a little certainty,” they whisper. “What will you trade?”</p></div><div class="choice-grid"><button class="choice-card" data-action="eventhealth"><div class="choice-icon">♥</div><h3>Offer a memory</h3><p>Lose 6 vitality. Gain 50 coins and a random relic.</p></button><button class="choice-card" data-action="eventcard"><div class="choice-icon">✦</div><h3>Study the map</h3><p>Choose a card in your deck to upgrade. No cost.</p></button><button class="choice-card" data-action="eventleave"><div class="choice-icon">↗</div><h3>Pass quietly</h3><p>No reward, no risk. Return to the climb.</p></button></div></section>`;
 return '';}
function chooseUpgrade(){const keys=[...new Set(state.deck)];state.phase='upgrade';renderUpgradePicker(keys,'Choose a card to upgrade.');}
function renderUpgradePicker(keys,title){const list=keys.map((k,i)=>`<button class="choice-card" data-action="upgradecard" data-card="${k}"><div class="choice-icon">${cardDefs[k].icon}</div><h3>${cardDefs[k].name}${state.upgrades.includes(k)?' +':''}</h3><p>${state.upgrades.includes(k)?upgradeDesc(k):cardDefs[k].desc}</p></button>`).join('');$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="eyebrow">Card mastery</div><h2>${title}</h2><p>Improving a card strengthens every copy of it in your deck.</p><div class="choice-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 0">${list}</div><div class="modal-actions"><button class="secondary-btn" data-action="cancelupgrade">Cancel</button></div></div></div>`;}
function restAction(action){if(action==='restheal'){let old=state.hero.hp;state.hero.hp=Math.min(state.hero.maxHp,state.hero.hp+20);addLog(`Recovered ${state.hero.hp-old} vitality.`);completeNode();}else if(action==='restupgrade'){const keys=[...new Set(state.deck)];renderUpgradePicker(keys,'Choose a card to engrave.');state.upgradeReturn='rest';}else completeNode();}
function eventAction(action){if(action==='eventhealth'){state.hero.hp=Math.max(1,state.hero.hp-6);state.gold+=50;grantRelic();completeNode();}else if(action==='eventcard'){state.upgradeReturn='event';const keys=[...new Set(state.deck)];renderUpgradePicker(keys,'Study the impossible map.');}else completeNode();}
function upgradeCard(k){if(!state.upgrades.includes(k)){state.upgrades.push(k);addLog(`${cardDefs[k].name} upgraded.`);}$('#modal-root').innerHTML='';if(state.upgradeReturn==='event'||state.upgradeReturn==='rest'){state.upgradeReturn=null;completeNode();}else render();}
function struggleFree(){if(state?.phase!=='combat'||state.hero.bind<=0||state.hero.struggleUsed)return;state.hero.struggleUsed=true;state.hero.bind=Math.max(0,state.hero.bind-1);if(state.hero.bind<4&&state.hero.gear)state.hero.gear.torso=0;if(state.hero.bind<3&&state.hero.gear)state.hero.gear.legs=0;if(state.hero.bind<2&&state.hero.gear)state.hero.gear.wrists=0;addLog('You twist against the magical bindings and loosen one restraint.');render();}
function playPotion(){if(state.potions<=0||state.phase!=='combat')return;state.potions--;let heal=Math.min(15,state.hero.maxHp-state.hero.hp);state.hero.hp+=heal;state.hero.bind=Math.max(0,state.hero.bind-1);addLog(`Potion restores ${heal} vitality and loosens one tether.`);render();}
function codex(){const root=$('#modal-root');root.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="eyebrow">Field manual</div><h2>How to climb the Spire</h2><p><b>Card combat.</b> Each turn you have 3 energy (sometimes modified by relics or tether pressure). Play cards from your hand, then end your turn. Used cards go to your discard pile; the pile reshuffles when your draw pile empties.</p><p><b>Guard & attacks.</b> Guard absorbs incoming damage for the current turn. Enemies telegraph their next move at the top-right of the arena: attack, heavy attack, tether, or brace.</p><p><b>Tether pressure.</b> Tethers accumulate to a maximum of 4. At 3 or more, they drain 1 energy from your next turn. Slip Knot, Thread Needle, and Unravel can reduce the pressure.</p><p><b>Restraint status.</b> Enemies can bind your wrists, legs, and torso as pressure rises. At 3 or more pressure, your next turn loses energy. Use escape cards or the once-per-turn Struggle Free action to reduce pressure; potions also loosen a tether.</p><p><b>The route.</b> Pick one node in each tier. Battles offer cards, elite rooms award relics, sanctuaries heal or upgrade, and caches/events offer risk/reward choices. Defeat the Warden at the summit to win.</p><div class="modal-actions"><button class="secondary-btn" data-action="closemodal">Return to game</button></div></div></div>`;}
function endScreen(win){return `<section class="centered panel empty-state"><div class="eyebrow">${win?'Ascension complete':'The Spire claims another challenger'}</div><h2>${win?'The Warden is broken.':'Your light fades.'}</h2><p>${win?'You mastered the shifting paths, broke the Warden’s last tether, and escaped the tower’s cycle. This run is complete.':'Your journey ends here, but every failed climb teaches you a new pattern. Rebuild your deck and try another route through the tower.'}<br><br><span class="gold">${state.roomsCleared} rooms cleared · ${state.deck.length} cards collected · ${state.gold} coins left</span></p><button class="cta" data-action="start">Climb again ↗</button><div class="feature-row" style="justify-content:center"><span class="feature">Your deck: ${state.deck.length} cards</span><span class="feature">Relics: ${state.relics.length}</span></div></section>`;}
function render(){const root=$('#screen');if(state){try{localStorage.setItem('aetherbound-spire-save',JSON.stringify(state));}catch(_){}}if(!state){root.innerHTML=titleScreen();return;}switch(state.phase){case'map':root.innerHTML=mapScreen();break;case'combat':root.innerHTML=combatScreen();break;case'reward':root.innerHTML=rewardScreen();break;case'rest':case'treasure':case'event':root.innerHTML=roomScreen(state.phase);break;case'upgrade':root.innerHTML=mapScreen();break;case'victory':root.innerHTML=endScreen(true);break;case'gameover':root.innerHTML=endScreen(false);break;default:root.innerHTML=titleScreen();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 switch(a){case'character':characterSheet();break;case'pose':characterSheet(b.dataset.pose,document.querySelector('.character-preview')?.classList.contains('cape-off')?false:true);break;case'cape':characterSheet(document.querySelector('.character-preview')?.classList.contains('pose-cast')?'cast':document.querySelector('.character-preview')?.classList.contains('pose-guard')?'guard':'idle',b.dataset.cape==='on');break;case'start':case'newrun':startRun();break;case'node':chooseNode(Number(b.dataset.row),Number(b.dataset.col));break;case'play':playCard(Number(b.dataset.index));break;case'endturn':endTurn();break;case'choosecard':chooseReward(Number(b.dataset.index));break;case'skipreward':state.gold+=15;completeNode();break;case'restheal':restAction('restheal');break;case'restupgrade':restAction('restupgrade');break;case'restskip':restAction('restskip');break;case'cachepotion':state.potions++;completeNode();break;case'continue':completeNode();break;case'eventhealth':eventAction('eventhealth');break;case'eventcard':eventAction('eventcard');break;case'eventleave':eventAction('eventleave');break;case'upgradecard':upgradeCard(b.dataset.card);break;case'cancelupgrade':$('#modal-root').innerHTML='';if(state.upgradeReturn){state.upgradeReturn=null;render();}break;case'codex':codex();break;case'closemodal':$('#modal-root').innerHTML='';break;case'potion':playPotion();break;case'struggle':struggleFree();break;}
});

try{const saved=localStorage.getItem('aetherbound-spire-save');if(saved){const parsed=JSON.parse(saved);if(parsed&&parsed.phase&&parsed.hero&&Array.isArray(parsed.deck)&&Array.isArray(parsed.map))state=parsed;}}catch(_){}
render();
})();
</script>
</body>
</html>
