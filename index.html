/* UI refresh: clearer hierarchy, touch-friendly controls, and responsive panels */
:root{--bg:#06091a;--panel:#0c1732;--panel2:#14264b;--line:#466fb0;--cyan:#8af0ff;--violet:#c4a6ff;--gold:#ffe2a8;--text:#f4f7ff;--muted:#b2c4e3}
body{background:radial-gradient(ellipse at 50% -12%,#254b8d 0,transparent 42%),radial-gradient(ellipse at 100% 40%,#29194c 0,transparent 40%),#050817;letter-spacing:.01em}
.app{max-width:1500px;padding:clamp(8px,1.6vw,22px)}
.top{position:sticky;top:6px;z-index:5;backdrop-filter:blur(16px);background:linear-gradient(110deg,#08152bf2,#10142df2);border-color:#5b8bd777;box-shadow:0 10px 30px #0005,0 0 25px #3988ff12}
.logo{display:grid;place-items:center;width:40px;height:40px;border:1px solid #74dfff66;border-radius:12px;background:linear-gradient(145deg,#173e70,#191a45);font-size:25px}
.brand{font-size:clamp(15px,1.5vw,20px);line-height:1.15}.brand small{margin-top:4px;font-size:9px;letter-spacing:.13em}
.resource{font-size:11px;font-weight:800;border-color:#496aa3;background:linear-gradient(145deg,#14284c,#0b1530);box-shadow:inset 0 1px #ffffff0c}
button{min-height:42px;border-color:#547fbd;background:linear-gradient(180deg,#21477e,#102348);border-radius:11px;transition:filter .15s,border-color .15s,transform .15s,box-shadow .15s;box-shadow:inset 0 1px #ffffff12,0 5px 12px #0003}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.panel{border-color:#42669caa;border-radius:16px;background:linear-gradient(145deg,#101d3aF5,#080f23F7);box-shadow:0 14px 34px #0004,inset 0 1px #ffffff08}
.panelhead{padding:13px 15px;background:linear-gradient(90deg,#15284b80,transparent);font-size:12px;text-transform:uppercase;letter-spacing:.075em}
.tag{font-weight:800;letter-spacing:.04em;background:#122a4b;border-color:#4c8bc0;color:#a9f2ff}
.scene{background:radial-gradient(ellipse at center,#13284a,#050b1b 75%)}
.scene canvas{image-rendering:auto}
.scene-label,.hint{box-shadow:0 8px 22px #0005;backdrop-filter:blur(12px);border-color:#6493c6aa}
.scene-label b{font-size:12px;letter-spacing:.04em}.scene-label small{font-size:10px}
.below{gap:14px;margin-top:14px}.log{line-height:1.65}.log div{padding-left:9px;border-left:2px solid #4d9cc766}
.controlpad{grid-template-columns:repeat(3,minmax(44px,52px));grid-template-rows:repeat(2,46px);gap:7px}.controlpad button{font-size:20px;background:linear-gradient(145deg,#214875,#101b3a);box-shadow:inset 0 1px #ffffff1b,0 3px 10px #0004}

.mini-map{gap:5px;padding:14px}.tile{border-radius:6px;box-shadow:inset 0 1px #ffffff08}.tile.seen{background:linear-gradient(145deg,#233e68,#11213f)}.tile.here{outline:2px solid #c7faff;outline-offset:1px;box-shadow:0 0 18px #65dfff}
.quest{line-height:1.65}.quest p{line-height:1.7}.widebuttons button{font-size:12px}.modal{backdrop-filter:blur(7px)}.modalbox{border-color:#6da6e6;background:linear-gradient(145deg,#172e56,#080f25);box-shadow:0 24px 80px #0009,0 0 50px #3a78ff2b}.modalbox{position:relative;max-height:min(86vh,760px);overflow:auto}.modalbox h2{letter-spacing:-.025em;padding-right:36px}.modal-close{position:absolute;right:12px;top:12px;width:36px;min-height:36px;padding:0;border-radius:10px;font-size:24px;line-height:1;background:#0a1530;border-color:#6289bb}.choices button{text-align:left;line-height:1.45;padding:12px}

function load(){try{const s=JSON.parse(localStorage.getItem('aetherbound-anime-explore-v4'));if(s&&s.floor){Object.assign(game,s);game.kills=game.kills||0;game.stamina=Number.isFinite(game.stamina)?game.stamina:100;game.maxStamina=Number.isFinite(game.maxStamina)?game.maxStamina:100;game.energy=Number.isFinite(game.energy)?game.energy:3;game.relics=game.relics||[];game.skills=game.skills||[];game.classId=game.classId==='vanguard'?'warrior':game.classId==='arcanist'?'mage':(CLASSES[game.classId]?game.classId:'mage');game.subclass=game.subclass||null;game.maxMana=Number.isFinite(game.maxMana)?game.maxMana:(game.classId==='mage'?100:40);game.energy=Math.min(game.energy,game.maxMana);game.skillPoints=game.skillPoints||0;game.run=game.run||1;game.turn=game.turn||0;game.inventory=(game.inventory||[]).map(v=>v==='Web Restraint'?'Blindfold — Web':/^(Rope Bindings|Leather Restraints|Living Tentacle Bind|Velvet Chain Restraint|Living Tendril Bind)( — .*)?$/.test(v)?pick(['Blindfold','Gag','Harness','Ankle Cuffs','Arm Cuffs','Leg Cuffs','Armbinder','Straightjacket','Leg Binder','Hood']):v);game.weapon=game.weapon||'Iron Sword';if(game.things){for(const [k,v] of Object.entries(game.things)){if(['enemy','tentacleGrowth','boss'].includes(v))delete game.things[k]}}if(game.mode==='battle'){game.mode='explore';game.enemy=null;}if(!game.inventory.some(v=>v==='Weapon: '+game.weapon))game.inventory.push('Weapon: '+game.weapon);game.restraints=game.inventory.filter(v=>['Blindfold','Gag','Harness','Ankle Cuffs','Arm Cuffs','Leg Cuffs','Armbinder','Straightjacket','Leg Binder','Hood'].some(n=>v===n||v.startsWith(n+' —'))).length;return true}}catch(e){}return false}
function makeRoom(){
 map=Array.from({length:H},()=>Array(W).fill(1));
 game.things={};
 // Every five-floor layer gets its own architectural footprint and corridor logic.
 const layer=Math.floor((game.floor-1)/5)%3; // Enemy territories replace the old generic six-theme rotation.
 const rooms=[];
 const roomTarget=[6,7,5][layer];
 const roomDims=[
   [3,5,3,4], // Gloomweb Warrens: cramped webbed chambers
   [3,6,4,6], // Bandit Stronghold: long halls and broad guardrooms
   [3,5,3,5]  // Tendril Abyss: irregular clustered chambers
 ][layer];
 for(let tries=0;tries<70 && rooms.length<roomTarget;tries++){
   let rw=roomDims[0]+rand(roomDims[1]-roomDims[0]+1),rh=roomDims[2]+rand(roomDims[3]-roomDims[2]+1);
   if(layer===1 && rand(2)===0){const t=rw;rw=rh;rh=t}
   if(layer===2 && rooms.length===0){rw=5;rh=5}
   const rx=1+rand(Math.max(1,W-rw-2)),ry=1+rand(Math.max(1,H-rh-2));
   const room={x:rx,y:ry,w:rw,h:rh,cx:Math.floor(rx+rw/2),cy:Math.floor(ry+rh/2)};
   const separated=rooms.every(r=>rx>=r.x+r.w+1||rx+rw+1<=r.x||ry>=r.y+r.h+1||ry+rh+1<=r.y);
   if(separated){rooms.push(room);for(let yy=ry;yy<ry+rh;yy++)for(let xx=rx;xx<rx+rw;xx++)map[yy][xx]=0;}
 }
 if(rooms.length<2){rooms.length=0;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)map[y][x]=0;rooms.push({cx:1,cy:1},{cx:W-2,cy:H-2})}
 // Connect rooms with layer-specific corridors: winding, crosswise, radial and looped paths.
 const carve=(x,y)=>{if(x>0&&x<W-1&&y>0&&y<H-1)map[y][x]=0};
 const tunnel=(a,b,order)=>{let x=a.cx,y=a.cy;carve(x,y);if(order==='v'){while(y!==b.cy){y+=Math.sign(b.cy-y);carve(x,y)}while(x!==b.cx){x+=Math.sign(b.cx-x);carve(x,y)}}else{while(x!==b.cx){x+=Math.sign(b.cx-x);carve(x,y)}while(y!==b.cy){y+=Math.sign(b.cy-y);carve(x,y)}}};
 // Each enemy territory has its own floor-plan logic.
 if(layer===2){const hub=rooms[0];for(let i=1;i<rooms.length;i++)tunnel(hub,rooms[i],i%2?'h':'v');}
 else {for(let i=1;i<rooms.length;i++){const order=layer===0?(i%2?'v':'h'):((i+layer)%2?'h':'v');tunnel(rooms[i-1],rooms[i],order);if(layer===1&&i>1&&i%2===0)tunnel(rooms[i-2],rooms[i],order==='h'?'v':'h');}}
 // Spider territory has narrow web-like cross passages; bandits hold a straight barracks hall;
 // the abyss uses a radial central chamber with branching tendril corridors.
 if(layer===0){const yy=Math.floor(H/2);for(let x=3;x<W-3;x++)if(map[yy][x]===0||x%4===0)carve(x,yy)}
 if(layer===1){const yy=Math.floor(H/2);for(let x=2;x<W-2;x++)carve(x,yy);for(let x=3;x<W-3;x+=4)for(let y=2;y<H-2;y++)if(map[y][x]===0||map[y][x-1]===0)carve(x,y)}
 if(layer===2){const cx=Math.floor(W/2),cy=Math.floor(H/2);for(let x=cx-2;x<=cx+2;x++)carve(x,cy);for(let y=cy-2;y<=cy+2;y++)carve(cx,y)}
 const first=rooms[0],last=rooms[rooms.length-1];
 game.x=first.cx;game.y=first.cy;carve(game.x,game.y);
 // Pick a reachable exit tile far from the spawn using a grid search.
 const dist=Array.from({length:H},()=>Array(W).fill(-1)),q=[[game.x,game.y]];dist[game.y][game.x]=0;
 for(let qi=0;qi<q.length;qi++){const [x,y]=q[qi];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx>0&&nx<W-1&&ny>0&&ny<H-1&&map[ny][nx]===0&&dist[ny][nx]===-1){dist[ny][nx]=dist[y][x]+1;q.push([nx,ny])}}}
 let exitX=last.cx,exitY=last.cy,best=-1;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(dist[y][x]>best){best=dist[y][x];exitX=x;exitY=y}
 const open=[];for(let yy=1;yy<H-1;yy++)for(let xx=1;xx<W-1;xx++)if(map[yy][xx]===0&&dist[yy][xx]>=2&&!(xx===exitX&&yy===exitY))open.push({x:xx,y:yy});
 const place=(type)=>{if(!open.length)return;const idx=rand(open.length),p=open.splice(idx,1)[0];game.things[p.x+','+p.y]=type};
 place('chest');place('shrine');if(Math.random()<0.8)place('prisonCell');
 const enemyCount=3+rand(2);const zoneEnemy=['spiderEnemy','banditEnemy','tentacleEnemy'][layer];for(let i=0;i<enemyCount;i++)place(zoneEnemy);
 if(layer===0){for(let i=0;i<3;i++)place('spikeTrap');place('tentacleTrap');}
 else if(layer===1){for(let i=0;i<2;i++)place('chainTrap');place('runeTrap');place('spikeTrap');}
 else {for(let i=0;i<2;i++)place('tentacleTrap');place('runeTrap');place('frostTrap');}
 game.things[exitX+','+exitY]=(game.floor%10===0?'wardenBoss':'exit');
 game.seen=[];reveal();heroPx={x:game.x,y:game.y};
}
function reveal(){for(let y=game.y-2;y<=game.y+2;y++)for(let x=game.x-2;x<=game.x+2;x++)if(y>=0&&y<H&&x>=0&&x<W)if((x-game.x)**2+(y-game.y)**2<=6&&!game.seen.includes(x+','+y))game.seen.push(x+','+y)}

 warrior:{name:'Warrior',role:'Physical fighter',desc:'Uses physical abilities powered by stamina. At level 15, choose Rampager or Magic Swordsman.',icon:'⚔'},
