function upgradeDesc(k){const map={jab:'Deal 10 damage.',veil:'Gain 11 guard.',spark:'Deal 12 damage.',slip:'Reduce bind by 3. Gain 6 guard.',step:'Gain 5 guard. Draw 1 card.',counter:'Deal 6 damage. Gain 7 guard.',nova:'Deal 21 damage.',echo:'Gain 1 energy. Draw 2 cards.',needle:'Deal 9 damage. Reduce bind by 2.',flare:'Deal 16 damage. Gain 6 guard.',ward:'Gain 8 guard. Weaken the next hit by 4.',unravel:'Reduce bind by 4. Draw 2 cards.'};return map[k]||cardDefs[k].desc;}

function reduceBind(n){let before=state.hero.bind;state.hero.bind=Math.max(0,state.hero.bind-n);let actual=before-state.hero.bind;addLog(actual?`You loosen ${actual} tether${actual===1?'':'s'}.`:'No tether to loosen.');}

 switch(k){case'jab':dmg(7);break;case'veil':gainBlock(up?11:8);break;case'spark':dmg(9);break;case'slip':reduceBind(up?3:2);gainBlock(up?6:4);break;case'step':gainBlock(up?5:3);drawCards(1);break;case'counter':dmg(4);gainBlock(up?7:5);break;case'nova':dmg(up?21:16);break;case'echo':state.energy+=1;drawCards(up?2:1);addLog('Mana surges through your deck.');break;case'needle':dmg(up?9:6);reduceBind(up?2:1);break;case'flare':dmg(up?16:12);gainBlock(up?6:4);break;case'ward':gainBlock(up?8:5);state.hero.weak=up?4:3;addLog('A mirror ward softens the next blow.');break;case'unravel':reduceBind(up?4:3);drawCards(up?2:1);break;}
 if(state.enemy.hp<=0){winBattle();return;}render();}
function enemyAct(){let e=state.enemy,h=state.hero;switch(e.intent){case'strike':case'heavy':{let raw=e.intentValue;if(h.weak){raw=Math.max(0,raw-h.weak);h.weak=0;}if(e.firstAttack&&state.relics.includes('feather')){raw=Math.max(0,raw-3);e.firstAttack=false;addLog('Glass Feather deflects part of the blow.');}const blocked=Math.min(h.block,raw);h.block-=blocked;const hpDmg=raw-blocked;h.hp-=hpDmg;if(hpDmg>0)hitFloat('hero-actor','−'+hpDmg);addLog(`${e.name} strikes for ${raw}${blocked?`, ${blocked} blocked`:''}.`);break;}case'snare':{let amount=e.intentValue||1;h.bind=clamp(h.bind+amount,0,4);if(h.gear){if(h.bind>=2)h.gear.wrists=1;if(h.bind>=3)h.gear.legs=1;if(h.bind>=4)h.gear.torso=1;}addLog(`Binding pressure rises by ${amount}; restraint level ${h.bind}/4.`);if(h.bind>=3)addLog('Tether pressure is high: next turn starts with less energy.');break;}case'brace':e.block+=e.intentValue;addLog(`${e.name} gains ${e.intentValue} guard.`);break;}}
function endTurn(){if(state.phase!=='combat')return;if(state.enemy.hp<=0){winBattle();return;}state.discard.push(...state.hand);state.hand=[];enemyAct();state.hero.block=0;if(state.hero.hp<=0){state.hero.hp=0;state.phase='gameover';render();return;}if(state.relics.includes('thread'))reduceBind(1);state.turn++;state.hero.struggleUsed=false;state.energy=Math.max(1,3+(state.relics.includes('lens')?1:0)-(state.hero.bind>=3?1:0));if(state.hero.bind>=3)addLog('Tether pressure drains 1 energy.');drawCards(5);rollIntent();render();}
function winBattle(){if(state.phase!=='combat')return;const boss=state.node?.type==='boss';state.hero.bind=0;state.hero.block=0;state.discard.push(...state.hand);state.hand=[];state.draw=[];if(boss){state.phase='victory';render();return;}state.phase='reward';state.rewardPool=[pick(allCardKeys),pick(allCardKeys),pick(allCardKeys)];while(new Set(state.rewardPool).size<3)state.rewardPool=[...new Set([...state.rewardPool,pick(allCardKeys)])].slice(0,3);if(state.extraReward)grantRelic();addLog('Victory. Choose a card to add to your deck.');render();}
function cardHTML(k,i,action='choosecard'){const c=cardDefs[k],up=state.upgrades.includes(k);return `<button class="card ${c.type}" data-action="${action}" data-index="${i}"><div class="card-top"><span class="card-cost">${upgradedCost(k)}</span><span class="card-type">${c.type}</span></div><div class="card-art">${c.icon}</div><div class="card-name">${c.name}${up?' +':''}</div><div class="card-desc">${up?upgradeDesc(k):c.desc}</div><div class="card-tag">${c.tag}</div></button>`;}
function rewardScreen(){return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Encounter cleared · ${state.roomsCleared} victory</div><h2>Choose your reward.</h2><p>A new technique joins your deck. Pick one card, or skip to continue climbing.<br><span class="gold">+15 aether coins</span> have been collected.</p></div><div class="reward-cards">${state.rewardPool.map((k,i)=>cardHTML(k,i)).join('')}</div><div style="text-align:center;padding:6px 15px 22px"><button class="secondary-btn" data-action="skipreward">Leave reward behind →</button></div></section>`;}
function chooseNode(row,col){if(!state||state.phase!=='map'||row!==state.stage)return;const n=state.map[row][col];if(!n||n.done)return;state.selected[row]=col;n.done=true;state.node=n;state.gold+=5;
 switch(n.type){case'battle':startBattle(false,false);break;case'elite':startBattle(true,false);break;case'boss':startBattle(false,true);break;case'rest':state.phase='rest';render();break;case'treasure':openTreasure();break;case'event':state.phase='event';render();break;}}
function openTreasure(){const newR=pick(Object.keys(relicDefs).filter(k=>!state.relics.includes(k)));if(newR)grantRelic(newR);state.gold+=20;state.phase='treasure';render();}
function grantRelic(key){key=key||pick(Object.keys(relicDefs).filter(k=>!state.relics.includes(k)));if(!key){state.gold+=15;return;}if(state.relics.includes(key)){state.gold+=15;return;}state.relics.push(key);if(key==='heart'){state.hero.maxHp+=8;state.hero.hp=Math.min(state.hero.maxHp,state.hero.hp+8);}if(key==='coin')state.gold+=25;addLog(`Relic acquired: ${relicDefs[key].name}.`);}
function completeNode(){state.roomsCleared++;state.stage++;state.node=null;if(state.stage>=7){state.phase='victory';}else{state.phase='map';addLog('The route ahead shifts into view.');}render();}
function chooseReward(i){let k=state.rewardPool[i];if(k){state.deck.push(k);state.gold+=15;addLog(`${cardDefs[k].name} added to your deck.`);}completeNode();}
function roomScreen(kind){if(kind==='rest')return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Sanctuary</div><h2>Take a moment to recover.</h2><p>A ring of warm runes hums quietly. Choose how to prepare for the next floor.</p></div><div class="choice-grid"><button class="choice-card" data-action="restheal"><div class="choice-icon">♨</div><h3>Rest by the brazier</h3><p>Recover 20 vitality, up to your maximum.</p></button><button class="choice-card" data-action="restupgrade"><div class="choice-icon">✧</div><h3>Inscribe a card</h3><p>Upgrade every copy of one card type, lowering its cost or improving its effect.</p></button><button class="choice-card" data-action="restskip"><div class="choice-icon">↗</div><h3>Move on</h3><p>Keep your resources and continue the ascent.</p></button></div></section>`;
 if(kind==='treasure')return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Hidden cache opened</div><h2>A relic for the road.</h2><p>You gained 20 coins and found a relic: <span class="gold">${relicDefs[state.relics[state.relics.length-1]]?.name||'Aether Shard'}</span>.</p></div><div class="choice-grid"><div class="choice-card"><div class="choice-icon">${relicDefs[state.relics[state.relics.length-1]]?.icon||'✧'}</div><h3>${relicDefs[state.relics[state.relics.length-1]]?.name||'Aether Shard'}</h3><p>${relicDefs[state.relics[state.relics.length-1]]?.desc||'A small piece of condensed aether.'}</p></div><button class="choice-card" data-action="cachepotion"><div class="choice-icon">♧</div><h3>Fill a potion vial</h3><p>Take one additional potion for a future emergency.</p></button><button class="choice-card" data-action="continue"><div class="choice-icon">↗</div><h3>Continue climbing</h3><p>Leave the chamber and return to the route map.</p></button></div></section>`;
 if(kind==='event')return `<section class="centered panel"><div class="screen-title"><div class="eyebrow">Strange encounter</div><h2>The Cartographer in Ash.</h2><p>A hooded figure sketches paths that do not exist on the wall. “Every shortcut takes a little certainty,” they whisper. “What will you trade?”</p></div><div class="choice-grid"><button class="choice-card" data-action="eventhealth"><div class="choice-icon">♥</div><h3>Offer a memory</h3><p>Lose 6 vitality. Gain 50 coins and a random relic.</p></button><button class="choice-card" data-action="eventcard"><div class="choice-icon">✦</div><h3>Study the map</h3><p>Choose a card in your deck to upgrade. No cost.</p></button><button class="choice-card" data-action="eventleave"><div class="choice-icon">↗</div><h3>Pass quietly</h3><p>No reward, no risk. Return to the climb.</p></button></div></section>`;
 return '';}
function chooseUpgrade(){const keys=[...new Set(state.deck)];state.phase='upgrade';renderUpgradePicker(keys,'Choose a card to upgrade.');}
function renderUpgradePicker(keys,title){const list=keys.map((k,i)=>`<button class="choice-card" data-action="upgradecard" data-card="${k}"><div class="choice-icon">${cardDefs[k].icon}</div><h3>${cardDefs[k].name}${state.upgrades.includes(k)?' +':''}</h3><p>${state.upgrades.includes(k)?upgradeDesc(k):cardDefs[k].desc}</p></button>`).join('');$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="eyebrow">Card mastery</div><h2>${title}</h2><p>Improving a card strengthens every copy of it in your deck.</p><div class="choice-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));padding:8px 0">${list}</div><div class="modal-actions"><button class="secondary-btn" data-action="cancelupgrade">Cancel</button></div></div></div>`;}
function restAction(action){if(action==='restheal'){let old=state.hero.hp;state.hero.hp=Math.min(state.hero.maxHp,state.hero.hp+20);addLog(`Recovered ${state.hero.hp-old} vitality.`);completeNode();}else if(action==='restupgrade'){const keys=[...new Set(state.deck)];renderUpgradePicker(keys,'Choose a card to engrave.');state.upgradeReturn='rest';}else completeNode();}
function eventAction(action){if(action==='eventhealth'){state.hero.hp=Math.max(1,state.hero.hp-6);state.gold+=50;grantRelic();completeNode();}else if(action==='eventcard'){state.upgradeReturn='event';const keys=[...new Set(state.deck)];renderUpgradePicker(keys,'Study the impossible map.');}else completeNode();}
function upgradeCard(k){if(!state.upgrades.includes(k)){state.upgrades.push(k);addLog(`${cardDefs[k].name} upgraded.`);}$('#modal-root').innerHTML='';if(state.upgradeReturn==='event'||state.upgradeReturn==='rest'){state.upgradeReturn=null;completeNode();}else render();}
function struggleFree(){if(state?.phase!=='combat'||state.hero.bind<=0||state.hero.struggleUsed)return;state.hero.struggleUsed=true;state.hero.bind=Math.max(0,state.hero.bind-1);if(state.hero.bind<4&&state.hero.gear)state.hero.gear.torso=0;if(state.hero.bind<3&&state.hero.gear)state.hero.gear.legs=0;if(state.hero.bind<2&&state.hero.gear)state.hero.gear.wrists=0;addLog('You twist against the magical bindings and loosen one restraint.');render();}
function playPotion(){if(state.potions<=0||state.phase!=='combat')return;state.potions--;let heal=Math.min(15,state.hero.maxHp-state.hero.hp);state.hero.hp+=heal;state.hero.bind=Math.max(0,state.hero.bind-1);addLog(`Potion restores ${heal} vitality and loosens one tether.`);render();}
function codex(){const root=$('#modal-root');root.innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="eyebrow">Field manual</div><h2>How to climb the Spire</h2><p><b>Card combat.</b> Each turn you have 3 energy (sometimes modified by relics or tether pressure). Play cards from your hand, then end your turn. Used cards go to your discard pile; the pile reshuffles when your draw pile empties.</p><p><b>Guard & attacks.</b> Guard absorbs incoming damage for the current turn. Enemies telegraph their next move at the top-right of the arena: attack, heavy attack, tether, or brace.</p><p><b>Tether pressure.</b> Tethers accumulate to a maximum of 4. At 3 or more, they drain 1 energy from your next turn. Slip Knot, Thread Needle, and Unravel can reduce the pressure.</p><p><b>Restraint status.</b> Enemies can bind your wrists, legs, and torso as pressure rises. At 3 or more pressure, your next turn loses energy. Use escape cards or the once-per-turn Struggle Free action to reduce pressure; potions also loosen a tether.</p><p><b>The route.</b> Pick one node in each tier. Battles offer cards, elite rooms award relics, sanctuaries heal or upgrade, and caches/events offer risk/reward choices. Defeat the Warden at the summit to win.</p><div class="modal-actions"><button class="secondary-btn" data-action="closemodal">Return to game</button></div></div></div>`;}
function endScreen(win){return `<section class="centered panel empty-state"><div class="eyebrow">${win?'Ascension complete':'The Spire claims another challenger'}</div><h2>${win?'The Warden is broken.':'Your light fades.'}</h2><p>${win?'You mastered the shifting paths, broke the Warden’s last tether, and escaped the tower’s cycle. This run is complete.':'Your journey ends here, but every failed climb teaches you a new pattern. Rebuild your deck and try another route through the tower.'}<br><br><span class="gold">${state.roomsCleared} rooms cleared · ${state.deck.length} cards collected · ${state.gold} coins left</span></p><button class="cta" data-action="start">Climb again ↗</button><div class="feature-row" style="justify-content:center"><span class="feature">Your deck: ${state.deck.length} cards</span><span class="feature">Relics: ${state.relics.length}</span></div></section>`;}
function render(){const root=$('#screen');if(state){try{localStorage.setItem('aetherbound-spire-save',JSON.stringify(state));}catch(_){}}if(!state){root.innerHTML=titleScreen();return;}switch(state.phase){case'map':root.innerHTML=mapScreen();break;case'combat':root.innerHTML=combatScreen();break;case'reward':root.innerHTML=rewardScreen();break;case'rest':case'treasure':case'event':root.innerHTML=roomScreen(state.phase);break;case'upgrade':root.innerHTML=mapScreen();break;case'victory':root.innerHTML=endScreen(true);break;case'gameover':root.innerHTML=endScreen(false);break;default:root.innerHTML=titleScreen();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 switch(a){case'start':case'newrun':startRun();break;case'node':chooseNode(Number(b.dataset.row),Number(b.dataset.col));break;case'play':playCard(Number(b.dataset.index));break;case'endturn':endTurn();break;case'choosecard':chooseReward(Number(b.dataset.index));break;case'skipreward':state.gold+=15;completeNode();break;case'restheal':restAction('restheal');break;case'restupgrade':restAction('restupgrade');break;case'restskip':restAction('restskip');break;case'cachepotion':state.potions++;completeNode();break;case'continue':completeNode();break;case'eventhealth':eventAction('eventhealth');break;case'eventcard':eventAction('eventcard');break;case'eventleave':eventAction('eventleave');break;case'upgradecard':upgradeCard(b.dataset.card);break;case'cancelupgrade':$('#modal-root').innerHTML='';if(state.upgradeReturn){state.upgradeReturn=null;render();}break;case'codex':codex();break;case'closemodal':$('#modal-root').innerHTML='';break;case'potion':playPotion();break;case'struggle':struggleFree();break;}
});

try{const saved=localStorage.getItem('aetherbound-spire-save');if(saved){const parsed=JSON.parse(saved);if(parsed&&parsed.phase&&parsed.hero&&Array.isArray(parsed.deck)&&Array.isArray(parsed.map))state=parsed;}}catch(_){}
render();
})();
</script>
</body>
</html>
